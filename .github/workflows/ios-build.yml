name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iOS app without signing
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project LiDARScanQuantApp/RoomPlanDemo.xcodeproj \
            -scheme RoomPlanDemo \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate app bundle
        id: app
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "RoomPlanDemo.app" -path "*Debug-iphoneos*" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app at: $APP_PATH"

      - name: Package IPA
        id: ipa
        run: |
          APP_PATH="${{ steps.app.outputs.app_path }}"
          STAGING="$RUNNER_TEMP/ipa-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"
          cd "$STAGING"
          zip -qry "$RUNNER_TEMP/RoomPlanDemo-Debug.ipa" Payload
          echo "ipa_path=$RUNNER_TEMP/RoomPlanDemo-Debug.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RoomPlanDemo-Debug-IPA
          path: ${{ steps.ipa.outputs.ipa_path }}

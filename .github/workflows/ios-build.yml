name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download crack YOLO weights
        run: |
          mkdir -p crack-recognition/models
          curl -sSL --retry 5 -o crack-recognition/models/crack_seg_n.pt \
            https://huggingface.co/OpenSistemas/YOLOv8-crack-seg/resolve/main/yolov8n/weights/best.pt
          curl -sSL --retry 5 -o crack-recognition/models/crack_seg_s.pt \
            https://huggingface.co/OpenSistemas/YOLOv8-crack-seg/resolve/main/yolov8s/weights/best.pt
          ls -lh crack-recognition/models

      - name: Export crack CoreML models
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "ultralytics>=8.2" "coremltools>=8,<9"
          python tools/coreml_export/export_yolo_seg.py
          mkdir -p ios/Robo/Resources/Models/compiled
          for name in crack_seg_n crack_seg_n_640 crack_seg_n_800 crack_seg_n_960 crack_seg_n_1280 crack_seg_n_1600 crack_seg_n_1920 crack_seg_n_2240 crack_seg_s; do
            xcrun coremlcompiler compile \
              "ios/Robo/Resources/Models/$name.mlpackage" \
              ios/Robo/Resources/Models/compiled
          done
          for name in crack_seg_n crack_seg_n_640 crack_seg_n_800 crack_seg_n_960 crack_seg_n_1280 crack_seg_n_1600 crack_seg_n_1920 crack_seg_n_2240 crack_seg_s; do
            rm -rf "ios/Robo/Resources/Models/$name.mlpackage"
            mv "ios/Robo/Resources/Models/compiled/$name.mlmodelc" \
              ios/Robo/Resources/Models/
          done
          rmdir ios/Robo/Resources/Models/compiled
          ls -lhR ios/Robo/Resources/Models

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          xcodebuild \
            -project RoboScan.xcodeproj \
            -scheme RoboScan \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate app bundle
        id: app
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "RoboScan.app" -path "*Debug-iphoneos*" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app at: $APP_PATH"

      - name: Package IPA
        id: ipa
        run: |
          APP_PATH="${{ steps.app.outputs.app_path }}"
          STAGING="$RUNNER_TEMP/ipa-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"
          cd "$STAGING"
          zip -qry "$RUNNER_TEMP/RoboScan-Debug.ipa" Payload
          echo "ipa_path=$RUNNER_TEMP/RoboScan-Debug.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RoboScan-Debug-IPA
          path: ${{ steps.ipa.outputs.ipa_path }}

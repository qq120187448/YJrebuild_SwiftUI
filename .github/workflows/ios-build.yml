name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build iOS app without signing
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project LiDARScanQuantApp/RoomPlanDemo.xcodeproj \
            -scheme RoomPlanDemo \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate app bundle
        id: app
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "RoomPlanDemo.app" -path "*Debug-iphoneos*" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app at: $APP_PATH"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: RoomPlanDemo-Debug
          path: ${{ steps.app.outputs.app_path }}

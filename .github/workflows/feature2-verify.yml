name: Feature 2 Dependency Verification

on:
  push:
    branches: [ "codex/feature2-verify" ]
  workflow_dispatch:

jobs:
  verify:
    name: Build SwiftIGL and Manifold for iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build for iOS Simulator
        working-directory: Feature2Verify
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swift build \
            --triple arm64-apple-ios-simulator \
            --sdk "$SDK" \
            -Xswiftc -swift-version \
            -Xswiftc 5

      - name: Report dependency size
        working-directory: Feature2Verify
        run: |
          du -sh .build 2>/dev/null || true
          du -sh .build/checkouts/* 2>/dev/null || true
          du -sh .build/artifacts/* 2>/dev/null || true

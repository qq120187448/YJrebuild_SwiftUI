name: Feature 2 Verification

on:
  push:
    branches: [ "codex/feature2-verify" ]
  workflow_dispatch:

jobs:
  verify:
    name: Build lightweight geometry libs and measure Release IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate verification app
        working-directory: Feature2Verify
        run: xcodegen generate --spec app-project.yml

      - name: Build Release app
        working-directory: Feature2Verify
        run: |
          xcodebuild \
            -project Feature2VerifyApp.xcodeproj \
            -scheme Feature2VerifyApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Measure app and IPA size
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name "Feature2VerifyApp.app" -path "*Release-iphoneos*" | head -n 1)
          echo "APP_PATH=$APP_PATH"
          du -sh "$APP_PATH"
          du -h "$APP_PATH/Feature2VerifyApp"

          STAGING="$RUNNER_TEMP/ipa-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"
          cd "$STAGING"
          zip -qry "$RUNNER_TEMP/Feature2VerifyApp.ipa" Payload
          ls -lh "$RUNNER_TEMP/Feature2VerifyApp.ipa"

name: RoboScan
options:
  bundleIdPrefix: com.silv
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "26.0"

packages:
  Voxels:
    url: https://github.com/heckj/Voxels.git
    from: 0.2.6
  iTriangle:
    url: https://github.com/iShape-Swift/iTriangle.git
    from: 1.17.0
  Euclid:
    url: https://github.com/nicklockwood/Euclid.git
    from: 0.8.20
  Manifold:
    url: https://github.com/tomasf/manifold-swift.git
    from: 1.1.0

settings:
  base:
    DEVELOPMENT_TEAM: R3Z5CY34Q5
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: RoboScan
    MARKETING_VERSION: 0.66
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    SWIFT_OBJC_INTEROP_MODE: objcxx
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: libc++

targets:
  RoboScan:
    type: application
    platform: iOS
    sources:
      - path: Robo/Resources/Assets.xcassets
      - path: Robo/Resources/Models
        type: folder
        buildPhase: resources
      - path: Robo/RoboApp.swift
      - path: Robo/Models/AppStrings.swift
      - path: Robo/Models/PhotoAttachment.swift
      - path: Robo/Models/RoomScanRecord.swift
      - path: Robo/Models/ComponentAdjustment.swift
      - path: Robo/Models/ObjectScanRecord.swift
      - path: Robo/Models/TextureScanRecord.swift
      - path: Robo/Models/ObjectCropVolume.swift
      - path: Robo/Models/WallDefectModels.swift
      - path: Robo/Models/CrackRecognitionModels.swift
      - path: Robo/Services/RoomDataProcessor.swift
      - path: Robo/Services/QuantityTakeoffExporter.swift
      - path: Robo/Services/PhotoStorage.swift
      - path: Robo/Services/ImageResizer.swift
      - path: Robo/Services/UnitPriceStore.swift
      - path: Robo/Services/XLSXWriter.swift
      - path: Robo/Services/ExportService.swift
      - path: Robo/Services/FloorPlanSVGGenerator.swift
      - path: Robo/Services/ModelExportService.swift
      - path: Robo/Services/ObjectScanProcessor.swift
      - path: Robo/Services/ObjectScanSettings.swift
      - path: Robo/Services/ObjectScanExporter.swift
      - path: Robo/Services/WallDefectGeometry.swift
      - path: Robo/Services/WallDefectPlaneEstimator.swift
      - path: Robo/Services/WallDefectStore.swift
      - path: Robo/Services/WallDefectARSessionStore.swift
      - path: Robo/Services/WallDefectProjection.swift
      - path: Robo/Services/WallDefectAligner.swift
      - path: Robo/Services/WallDefectHeadingService.swift
      - path: Robo/Services/CrackRecognitionSettings.swift
      - path: Robo/Services/CrackSkeleton.swift
      - path: Robo/Services/CrackYOLODecoder.swift
      - path: Robo/Services/CrackRecognitionEngine.swift
      - path: Robo/Views/ActivityView.swift
      - path: Robo/Views/ContentView.swift
      - path: Robo/Views/CaptureHomeView.swift
      - path: Robo/Views/CameraPicker.swift
      - path: Robo/Views/LiDARScanView.swift
      - path: Robo/Views/RoomCaptureViewWrapper.swift
      - path: Robo/Views/RoomResultView.swift
      - path: Robo/Views/ComponentAdjustmentView.swift
      - path: Robo/Views/QuantityPreviewView.swift
      - path: Robo/Views/ScanHistoryView.swift
      - path: Robo/Views/RoomDetailView.swift
      - path: Robo/Views/FloorPlan2DView.swift
      - path: Robo/Views/Room3DView.swift
      - path: Robo/Views/SettingsView.swift
      - path: Robo/Views/ObjectScanView.swift
      - path: Robo/Views/ObjectScanDetailView.swift
      - path: Robo/Views/ObjectPointCloud3DView.swift
      - path: Robo/Views/ObjectCropBox3DView.swift
      - path: Robo/Views/ObjectBoxVisual.swift
      - path: Robo/Views/ObjectCaptureTextureScanView.swift
      - path: Robo/Views/ARKitDefectCameraView.swift
      - path: Robo/Views/ToyBoxView.swift
      - path: Robo/Views/WallDefectScanView.swift
      - path: Robo/Views/WallDefectModelView.swift
      - path: Robo/Views/WallDefectScanDetailView.swift
      - path: Robo/Views/RoomScanSettingsView.swift
      - path: Robo/Views/ObjectScanSettingsView.swift
      - path: Robo/Views/WallDefectSettingsView.swift
      - path: Robo/Views/CrackRecognitionSettingsView.swift
      - path: Robo/Views/CrackPhotoLabView.swift
      - path: Robo/Views/CrackModelValidationView.swift
      - path: Robo/Views/CrackRecognitionResultView.swift
    dependencies:
      - package: Voxels
      - package: iTriangle
      - package: Euclid
      - package: Manifold
    settings:
      base:
        INFOPLIST_FILE: Robo/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.silv.RoboScan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Robo/Info.plist
      properties:
        CFBundleDisplayName: 工程量扫描
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.silv.RoboScan.crack
            CFBundleURLSchemes:
              - roboscan
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 需要相机和 LiDAR 权限来进行房间扫描。
        NSLocationWhenInUseUsageDescription: 需要使用定位与指南针来校准房间方向。
        NSPhotoLibraryUsageDescription: 需要相册权限来选择缺陷照片进行识别。
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

  RoboScan4A:
    type: application
    platform: iOS
    sources:
      - path: Robo4A
      - path: Robo/Services/CrackYOLODecoder.swift
      - path: Robo/Services/CrackSkeleton.swift
      - path: Robo/Services/CrackRecognitionSettings.swift
      - path: Robo/Resources/Models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: RoboScan4A
        MARKETING_VERSION: 0.66
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: Robo4A/Info.plist
      properties:
        CFBundleDisplayName: 裂缝4A
        CFBundleDevelopmentRegion: zh-Hans
        NSPhotoLibraryUsageDescription: 需要相册权限选择裂缝照片进行识别。
        UILaunchScreen: {}
        UIRequiresFullScreen: true
